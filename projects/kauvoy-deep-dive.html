async function unlock(){
  const pw = document.getElementById('pw').value;
  const err = document.getElementById('err');
  err.style.display = 'none';
  try {
    const raw = Uint8Array.from(atob(CIPHER), c => c.charCodeAt(0));
    const salt = raw.slice(8, 16), data = raw.slice(16);
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({name:'PBKDF2', salt, iterations:310000, hash:'SHA-256'}, km, 384);
    const kb = new Uint8Array(bits);
    const key = await crypto.subtle.importKey('raw', kb.slice(0,32), {name:'AES-CBC'}, false, ['decrypt']);
    const pt = await crypto.subtle.decrypt({name:'AES-CBC', iv: kb.slice(32,48)}, key, data);
    const html = new TextDecoder().decode(pt);
    document.open(); document.write(html); document.close();
  } catch(e) {
    err.style.display = 'block';
  }
}
document.getElementById('pw').addEventListener('keydown', e => { if(e.key === 'Enter') unlock(); });
