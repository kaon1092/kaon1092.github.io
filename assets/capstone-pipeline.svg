<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="Malgun Gothic, 'Segoe UI', sans-serif">
  <defs>
    <marker id="pa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="po" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
    </marker>
  </defs>
  <rect width="1680" height="1000" fill="#fcfcfb"/>

  <text x="840" y="50" font-size="28" font-weight="bold" fill="#0b0b0b" text-anchor="middle">6DOF Missile Flight Simulation &amp; ADRC Control Pipeline</text>
  <text x="840" y="80" font-size="15" fill="#52514e" text-anchor="middle">제원·환경 모델 → 6DOF 동역학(RK4) ↔ ADRC 제어 루프 → 결과 분석</text>

  <!-- ===== Configuration & Parameters ===== -->
  <rect x="180" y="100" width="640" height="180" rx="12" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2"/>
  <text x="500" y="130" font-size="18" font-weight="bold" fill="#2a78d6" text-anchor="middle">Configuration &amp; Parameters</text>
  <rect x="200" y="148" width="190" height="112" rx="9" fill="#ffffff" stroke="#9fb7e6" stroke-width="1.5"/>
  <text x="295" y="196" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Mass &amp; Inertia</text>
  <text x="295" y="222" font-size="13" fill="#52514e" text-anchor="middle">Missile properties</text>
  <rect x="405" y="148" width="190" height="112" rx="9" fill="#ffffff" stroke="#9fb7e6" stroke-width="1.5"/>
  <text x="500" y="186" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Aerodynamic</text>
  <text x="500" y="207" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Coeffs</text>
  <text x="500" y="232" font-size="13" fill="#52514e" text-anchor="middle">Look-up tables</text>
  <rect x="610" y="148" width="190" height="112" rx="9" fill="#ffffff" stroke="#9fb7e6" stroke-width="1.5"/>
  <text x="705" y="186" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Sim Time &amp;</text>
  <text x="705" y="207" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Step Size</text>
  <text x="705" y="232" font-size="13" fill="#52514e" text-anchor="middle">Δt, t_final</text>

  <!-- ===== Environment & Disturbance Models ===== -->
  <rect x="980" y="100" width="660" height="180" rx="12" fill="#f4effb" stroke="#7b5cc4" stroke-width="2"/>
  <text x="1310" y="130" font-size="18" font-weight="bold" fill="#7b5cc4" text-anchor="middle">Environment &amp; Disturbance Models</text>
  <rect x="1000" y="148" width="200" height="112" rx="9" fill="#ffffff" stroke="#c1b2e6" stroke-width="1.5"/>
  <text x="1100" y="186" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">US Standard</text>
  <text x="1100" y="207" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Atmosphere</text>
  <text x="1100" y="232" font-size="13" fill="#52514e" text-anchor="middle">Density, pressure</text>
  <rect x="1210" y="148" width="200" height="112" rx="9" fill="#ffffff" stroke="#c1b2e6" stroke-width="1.5"/>
  <text x="1310" y="196" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Gravity Model</text>
  <text x="1310" y="222" font-size="13" fill="#52514e" text-anchor="middle">WGS-84</text>
  <rect x="1420" y="148" width="200" height="112" rx="9" fill="#ffffff" stroke="#c1b2e6" stroke-width="1.5"/>
  <text x="1520" y="186" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Wind &amp;</text>
  <text x="1520" y="207" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Turbulence</text>
  <text x="1520" y="232" font-size="13" fill="#52514e" text-anchor="middle">Dryden / von Kármán</text>

  <line x1="820" y1="190" x2="972" y2="190" stroke="#52514e" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="900" y="178" font-size="12.5" fill="#52514e" text-anchor="middle">Configuration data</text>

  <!-- 상단 → 동역학 -->
  <path d="M 760 280 L 760 322 L 1100 322 L 1100 352" stroke="#52514e" stroke-width="1.8" fill="none" marker-end="url(#pa)"/>
  <text x="930" y="314" font-size="12.5" fill="#52514e" text-anchor="middle">Mass · inertia · aero data</text>
  <line x1="1300" y1="280" x2="1300" y2="352" stroke="#7b5cc4" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="1290" y="322" font-size="12.5" fill="#7b5cc4" text-anchor="end">Atmospheric state</text>
  <line x1="1520" y1="280" x2="1520" y2="352" stroke="#7b5cc4" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="1510" y="322" font-size="12.5" fill="#7b5cc4" text-anchor="end">Wind disturbances</text>

  <!-- ===== ADRC Controller ===== -->
  <rect x="180" y="360" width="640" height="360" rx="12" fill="#fdf3ec" stroke="#eb6834" stroke-width="2"/>
  <text x="500" y="392" font-size="18" font-weight="bold" fill="#eb6834" text-anchor="middle">ADRC Controller (Active Disturbance Rejection)</text>

  <rect x="230" y="420" width="240" height="80" rx="9" fill="#ffffff" stroke="#f0a780" stroke-width="1.5"/>
  <text x="350" y="454" font-size="15.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Tracking Differentiator</text>
  <text x="350" y="478" font-size="13" fill="#52514e" text-anchor="middle">(TD)</text>
  <rect x="560" y="420" width="240" height="80" rx="9" fill="#ffffff" stroke="#eb6834" stroke-width="2.2"/>
  <text x="680" y="454" font-size="15.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Extended State Observer</text>
  <text x="680" y="478" font-size="13" fill="#52514e" text-anchor="middle">(ESO)</text>
  <rect x="230" y="590" width="240" height="80" rx="9" fill="#ffffff" stroke="#f0a780" stroke-width="1.5"/>
  <text x="350" y="624" font-size="15.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Nonlinear State Feedback</text>
  <text x="350" y="648" font-size="13" fill="#52514e" text-anchor="middle">(NLSEF)</text>
  <rect x="560" y="590" width="240" height="80" rx="9" fill="#ffffff" stroke="#f0a780" stroke-width="1.5"/>
  <text x="680" y="624" font-size="15.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Control Law &amp; Actuator</text>
  <text x="680" y="648" font-size="13" fill="#52514e" text-anchor="middle">Dynamics</text>

  <line x1="470" y1="460" x2="552" y2="460" stroke="#52514e" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="514" y="448" font-size="12" fill="#52514e" text-anchor="middle">Target</text>
  <text x="514" y="486" font-size="12" fill="#52514e" text-anchor="middle">position</text>
  <line x1="290" y1="500" x2="290" y2="582" stroke="#52514e" stroke-width="1.8" marker-end="url(#pa)"/>
  <path d="M 600 500 L 600 545 L 410 545 L 410 582" stroke="#eb6834" stroke-width="2" fill="none" marker-end="url(#po)"/>
  <text x="505" y="537" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="bold">Disturbance f̂(t)</text>
  <line x1="470" y1="630" x2="552" y2="630" stroke="#52514e" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="514" y="618" font-size="12" fill="#52514e" text-anchor="middle">Virtual</text>
  <text x="514" y="656" font-size="12" fill="#52514e" text-anchor="middle">control u₀</text>
  <line x1="760" y1="590" x2="760" y2="508" stroke="#52514e" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="752" y="545" font-size="12" fill="#52514e" text-anchor="end">Control</text>
  <text x="752" y="561" font-size="12" fill="#52514e" text-anchor="end">input u</text>

  <!-- 외부 입력 -->
  <text x="20" y="444" font-size="13.5" font-weight="bold" fill="#0b0b0b">Guidance commands</text>
  <text x="20" y="462" font-size="12.5" fill="#52514e">(LOS, target track)</text>
  <line x1="20" y1="472" x2="222" y2="472" stroke="#52514e" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="20" y="618" font-size="13.5" font-weight="bold" fill="#0b0b0b">Navigation state</text>
  <line x1="20" y1="632" x2="222" y2="632" stroke="#52514e" stroke-width="1.8" marker-end="url(#pa)"/>

  <!-- ===== 6DOF Dynamics Engine ===== -->
  <rect x="980" y="360" width="660" height="360" rx="12" fill="#eefaf3" stroke="#2e9a5a" stroke-width="2"/>
  <text x="1310" y="392" font-size="18" font-weight="bold" fill="#2e9a5a" text-anchor="middle">6DOF Dynamics Engine</text>
  <rect x="1000" y="420" width="300" height="100" rx="9" fill="#ffffff" stroke="#9ed2b4" stroke-width="1.5"/>
  <text x="1150" y="460" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Forces &amp; Moments Solver</text>
  <text x="1150" y="486" font-size="13" fill="#52514e" text-anchor="middle">Aerodynamic, thrust, gravity</text>
  <rect x="1320" y="420" width="300" height="100" rx="9" fill="#ffffff" stroke="#9ed2b4" stroke-width="1.5"/>
  <text x="1470" y="460" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Rigid Body Kinematics</text>
  <text x="1470" y="486" font-size="13" fill="#52514e" text-anchor="middle">&amp; Dynamics (trans. · rot.)</text>
  <rect x="1000" y="566" width="620" height="110" rx="9" fill="#ffffff" stroke="#2e9a5a" stroke-width="2.2"/>
  <text x="1310" y="610" font-size="16.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Runge-Kutta 4th Order Integrator (RK4)</text>
  <text x="1310" y="638" font-size="13" fill="#52514e" text-anchor="middle">Solves the equations of motion each step</text>
  <line x1="1300" y1="470" x2="1312" y2="470" stroke="#52514e" stroke-width="1.6" marker-end="url(#pa)"/>
  <line x1="1150" y1="520" x2="1150" y2="558" stroke="#52514e" stroke-width="1.6" marker-end="url(#pa)"/>
  <line x1="1470" y1="520" x2="1470" y2="558" stroke="#52514e" stroke-width="1.6" marker-end="url(#pa)"/>

  <!-- 동역학 ↔ ADRC -->
  <line x1="980" y1="460" x2="808" y2="460" stroke="#52514e" stroke-width="2" marker-end="url(#pa)"/>
  <text x="900" y="420" font-size="12.5" fill="#0b0b0b" text-anchor="middle" font-weight="bold">Actual flight state</text>
  <text x="900" y="438" font-size="11.5" fill="#52514e" text-anchor="middle">x, y, z, V,</text>
  <text x="900" y="452" font-size="11.5" fill="#52514e" text-anchor="middle">p, q, r, φ, θ, ψ</text>
  <line x1="800" y1="630" x2="992" y2="630" stroke="#eb6834" stroke-width="2" marker-end="url(#po)"/>
  <text x="900" y="604" font-size="12.5" fill="#eb6834" text-anchor="middle" font-weight="bold">Actuator deflection</text>
  <text x="900" y="620" font-size="12" fill="#eb6834" text-anchor="middle">(δe, δr, δa)</text>

  <!-- ===== Data Analysis & Plotting Dashboard ===== -->
  <rect x="980" y="780" width="660" height="190" rx="12" fill="#eef4fc" stroke="#2a5bb5" stroke-width="2"/>
  <text x="1310" y="810" font-size="18" font-weight="bold" fill="#2a5bb5" text-anchor="middle">Data Analysis &amp; Plotting Dashboard</text>
  <rect x="1000" y="828" width="148" height="120" rx="9" fill="#ffffff" stroke="#a8bde6" stroke-width="1.5"/>
  <text x="1074" y="872" font-size="14.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Flight</text>
  <text x="1074" y="892" font-size="14.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Trajectory</text>
  <text x="1074" y="918" font-size="12.5" fill="#52514e" text-anchor="middle">3D plotter</text>
  <rect x="1158" y="828" width="148" height="120" rx="9" fill="#ffffff" stroke="#a8bde6" stroke-width="1.5"/>
  <text x="1232" y="872" font-size="14.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">State</text>
  <text x="1232" y="892" font-size="14.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Tracking</text>
  <text x="1232" y="918" font-size="12.5" fill="#52514e" text-anchor="middle">Error analysis</text>
  <rect x="1316" y="828" width="148" height="120" rx="9" fill="#ffffff" stroke="#a8bde6" stroke-width="1.5"/>
  <text x="1390" y="872" font-size="14.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Disturbance</text>
  <text x="1390" y="892" font-size="14.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Rejection</text>
  <text x="1390" y="918" font-size="12.5" fill="#52514e" text-anchor="middle">Evaluation</text>
  <rect x="1474" y="828" width="148" height="120" rx="9" fill="#ffffff" stroke="#a8bde6" stroke-width="1.5"/>
  <text x="1548" y="872" font-size="14.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Actuator</text>
  <text x="1548" y="892" font-size="14.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Saturation</text>
  <text x="1548" y="918" font-size="12.5" fill="#52514e" text-anchor="middle">Monitor</text>

  <line x1="1310" y1="720" x2="1310" y2="772" stroke="#52514e" stroke-width="1.8" marker-end="url(#pa)"/>
  <text x="1322" y="742" font-size="12.5" fill="#0b0b0b" font-weight="bold">Position &amp; orientation</text>
  <text x="1322" y="760" font-size="11.5" fill="#52514e">[x, y, z, V, p, q, r, φ, θ, ψ]</text>

  <path d="M 680 670 L 680 870 L 972 870" stroke="#52514e" stroke-width="1.8" fill="none" marker-end="url(#pa)"/>
  <text x="826" y="860" font-size="12.5" fill="#52514e" text-anchor="middle">Control log</text>

  <!-- 유도 명령 피드백 -->
  <path d="M 980 940 L 168 940 L 168 472" stroke="#52514e" stroke-width="1.6" stroke-dasharray="6 4" fill="none"/>
  <text x="574" y="930" font-size="12.5" fill="#52514e" text-anchor="middle">Guidance commands (LOS, target track)</text>
</svg>
