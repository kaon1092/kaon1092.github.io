<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 1000" font-family="Malgun Gothic, 'Segoe UI', sans-serif">
  <defs>
    <marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="cb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
  </defs>
  <rect width="1680" height="1000" fill="#fcfcfb"/>

  <text x="40" y="54" font-size="27" font-weight="bold" fill="#0b0b0b">제어 시스템 아키텍처 — Dual EKF 측위 기반 MPC · Fallback 제어 구조 (jw_ws 10.08)</text>
  <text x="40" y="84" font-size="15" fill="#52514e">센서 → 측위(robot_localization) → 지역 경로(LPP) → 병렬 제어기(MPC / Fallback) → Control Decision 중재 → MORAI</text>

  <!-- ===== Row A: 센서 ===== -->
  <text x="150" y="122" font-size="13.5" font-weight="bold" fill="#52514e" text-anchor="middle">MORAI 센서 (UDP)</text>
  <rect x="40" y="132" width="220" height="50" rx="9" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/>
  <text x="150" y="155" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">GPS</text>
  <text x="150" y="173" font-size="12" fill="#52514e" text-anchor="middle" font-family="Consolas, monospace">/gps · UDP 7769</text>
  <rect x="40" y="192" width="220" height="50" rx="9" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/>
  <text x="150" y="215" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">IMU</text>
  <text x="150" y="233" font-size="12" fill="#52514e" text-anchor="middle" font-family="Consolas, monospace">/imu · UDP 7779</text>
  <rect x="40" y="252" width="220" height="50" rx="9" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/>
  <text x="150" y="275" font-size="16" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Encoder (차량 상태)</text>
  <text x="150" y="293" font-size="12" fill="#52514e" text-anchor="middle" font-family="Consolas, monospace">/odometry/wheel · UDP 7789</text>

  <line x1="260" y1="157" x2="312" y2="170" stroke="#52514e" stroke-width="1.6" marker-end="url(#ca)"/>
  <line x1="260" y1="217" x2="312" y2="217" stroke="#52514e" stroke-width="1.6" marker-end="url(#ca)"/>
  <line x1="260" y1="277" x2="312" y2="264" stroke="#52514e" stroke-width="1.6" marker-end="url(#ca)"/>

  <!-- 측위 -->
  <rect x="320" y="132" width="330" height="170" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="3"/>
  <text x="485" y="164" font-size="17.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Localization</text>
  <text x="485" y="186" font-size="14" fill="#2a78d6" text-anchor="middle" font-weight="bold">robot_localization — Dual EKF</text>
  <text x="485" y="214" font-size="13" fill="#52514e" text-anchor="middle">EKF Local: IMU + Wheel → odom</text>
  <text x="485" y="236" font-size="13" fill="#52514e" text-anchor="middle">EKF Global: + GPS (navsat_transform) → map</text>
  <text x="485" y="266" font-size="13" fill="#0b0b0b" text-anchor="middle" font-family="Consolas, monospace">/odometry/filtered_map</text>
  <text x="485" y="286" font-size="12.5" fill="#52514e" text-anchor="middle">50Hz · 모든 노드가 사용</text>

  <!-- 전역 경로 -->
  <rect x="740" y="140" width="250" height="100" rx="10" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/>
  <text x="865" y="174" font-size="17.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Global Path</text>
  <text x="865" y="198" font-size="13" fill="#0b0b0b" text-anchor="middle" font-family="Consolas, monospace">/global_path</text>
  <text x="865" y="220" font-size="12.5" fill="#52514e" text-anchor="middle">대회 전역경로 CSV (중심선 평활화)</text>

  <!-- 미션 -->
  <rect x="1260" y="132" width="380" height="124" rx="10" fill="#f1f0ec" stroke="#52514e" stroke-width="1.5"/>
  <text x="1450" y="164" font-size="17.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Mission</text>
  <text x="1450" y="188" font-size="13.5" fill="#52514e" text-anchor="middle">신호등 · 회피 · 차선변경</text>
  <text x="1450" y="212" font-size="12" fill="#52514e" text-anchor="middle" font-family="Consolas, monospace">/traffic/speed_limit · /avoid/path</text>
  <text x="1450" y="232" font-size="12" fill="#52514e" text-anchor="middle" font-family="Consolas, monospace">/lane_ref_path · /traffic_stop_distance</text>

  <!-- ===== Row B: LPP ===== -->
  <rect x="740" y="326" width="500" height="100" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="2.2"/>
  <text x="990" y="358" font-size="18" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Local Path Planner (LPP)</text>
  <text x="990" y="382" font-size="13" fill="#52514e" text-anchor="middle">창 슬라이스 ≤30 m (ds 0.5 m) + 곡률 속도 프로파일 (a_lat ≤ 3.0)</text>
  <text x="990" y="404" font-size="13" fill="#0b0b0b" text-anchor="middle" font-family="Consolas, monospace">v_target[i] = min(곡률 상한, 미션 상한) · 20Hz</text>

  <line x1="865" y1="240" x2="865" y2="318" stroke="#52514e" stroke-width="1.8" marker-end="url(#ca)"/>
  <text x="875" y="290" font-size="12" fill="#52514e" font-family="Consolas, monospace">/global_path</text>
  <path d="M 1300 256 L 1300 376 L 1248 376" stroke="#52514e" stroke-width="1.8" fill="none" marker-end="url(#ca)"/>
  <text x="1312" y="320" font-size="12" fill="#52514e">speed limit · avoid path</text>
  <text x="1312" y="338" font-size="12" fill="#52514e">· lane change</text>

  <!-- ===== 공통 측위 토픽 ===== -->
  <rect x="40" y="452" width="1600" height="40" rx="8" fill="#f1f0ec" stroke="#2a78d6" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="62" y="477" font-size="14" font-weight="bold" fill="#2a78d6">/odometry/filtered_map (Dual EKF 측위 출력)</text>
  <text x="1092" y="477" font-size="13" fill="#2a78d6">LPP · MPC · Fallback · Decision이 함께 구독</text>
  <line x1="485" y1="302" x2="485" y2="446" stroke="#2a78d6" stroke-width="2.2" marker-end="url(#cb)"/>
  <line x1="780" y1="452" x2="780" y2="434" stroke="#2a78d6" stroke-width="2" marker-end="url(#cb)"/>

  <!-- 전역경로 직결 (fallback) -->
  <path d="M 740 225 L 700 225 L 700 520 L 560 520 L 560 540" stroke="#52514e" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ca)"/>
  <text x="694" y="336" font-size="12" fill="#52514e" text-anchor="end" font-family="Consolas, monospace">/global_path</text>
  <text x="694" y="354" font-size="12" fill="#52514e" text-anchor="end">(direct)</text>

  <!-- ===== Row C: 병렬 제어기 ===== -->
  <rect x="280" y="516" width="1000" height="152" rx="14" fill="none" stroke="#9a9890" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="1270" y="660" font-size="13" fill="#52514e" text-anchor="end">병렬 제어기 (MPC · Fallback 동시 실행)</text>

  <rect x="300" y="540" width="340" height="100" rx="10" fill="#f1f0ec" stroke="#52514e" stroke-width="1.8"/>
  <text x="470" y="572" font-size="17.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Stanley-PID Fallback</text>
  <text x="470" y="596" font-size="13" fill="#52514e" text-anchor="middle">Stanley 조향 + PID 속도 · 자체 3중 감속</text>
  <text x="470" y="618" font-size="13" fill="#52514e" text-anchor="middle">MPC 이상 시 대신 제어 (예비 제어기)</text>

  <rect x="900" y="540" width="340" height="100" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="3"/>
  <text x="1070" y="572" font-size="17.5" font-weight="bold" fill="#0b0b0b" text-anchor="middle">LTV-MPC</text>
  <text x="1070" y="596" font-size="13" fill="#52514e" text-anchor="middle">N=20 · dt 0.05 s (1.0 s 예측) · 50Hz</text>
  <text x="1070" y="618" font-size="13" fill="#52514e" text-anchor="middle">조향 + 가감속 동시 최적화 · 지연 추정·보상</text>

  <!-- LPP → 제어기 -->
  <line x1="1070" y1="426" x2="1070" y2="532" stroke="#52514e" stroke-width="2" marker-end="url(#ca)"/>
  <text x="1060" y="512" font-size="12" fill="#52514e" text-anchor="end" font-family="Consolas, monospace">/local_path (path + v_target)</text>
  <path d="M 800 426 L 800 590 L 648 590" stroke="#52514e" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#ca)"/>
  <text x="724" y="582" font-size="12" fill="#52514e" text-anchor="middle">v_target only</text>
  <!-- 측위 토픽 → 제어기 -->
  <line x1="420" y1="492" x2="420" y2="532" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#cb)"/>
  <line x1="1180" y1="492" x2="1180" y2="532" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#cb)"/>
  <path d="M 260 492 L 260 770 L 512 770" stroke="#2a78d6" stroke-width="1.6" stroke-dasharray="4 3" fill="none" marker-end="url(#cb)"/>

  <!-- ===== Row D: Control Decision ===== -->
  <rect x="520" y="716" width="500" height="112" rx="10" fill="#eaf2fc" stroke="#2a78d6" stroke-width="3"/>
  <text x="770" y="748" font-size="18" font-weight="bold" fill="#0b0b0b" text-anchor="middle">Control Decision — 최종 명령 /ctrl_cmd 출력</text>
  <text x="770" y="774" font-size="13" fill="#52514e" text-anchor="middle">제어기 선택(MPC / Fallback) · 속도 상한 적용 · 안전 처리</text>
  <text x="770" y="796" font-size="13" fill="#52514e" text-anchor="middle">계측 건강도 · odom 가드 · 과속 가드 · HOLD / EMERGENCY</text>
  <text x="770" y="816" font-size="12.5" fill="#2a78d6" text-anchor="middle" font-weight="bold">조향은 MPC 값 유지 (MPC 정상 시)</text>

  <line x1="560" y1="640" x2="560" y2="708" stroke="#52514e" stroke-width="1.8" marker-end="url(#ca)"/>
  <text x="572" y="678" font-size="12" fill="#52514e" font-family="Consolas, monospace">/control/fallback_cmd</text>
  <line x1="960" y1="640" x2="960" y2="708" stroke="#52514e" stroke-width="2" marker-end="url(#ca)"/>
  <text x="948" y="704" font-size="12" fill="#52514e" text-anchor="end" font-family="Consolas, monospace">/control/mpc_cmd · /mpc/diagnostic</text>
  <line x1="1000" y1="716" x2="1000" y2="648" stroke="#2a78d6" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#cb)"/>
  <text x="1010" y="700" font-size="11.5" fill="#2a78d6" font-family="Consolas, monospace">decision_diagnostic</text>

  <!-- 미션 → decision -->
  <path d="M 1600 256 L 1600 790 L 1028 790" stroke="#52514e" stroke-width="1.8" fill="none" marker-end="url(#ca)"/>
  <text x="1590" y="770" font-size="12" fill="#52514e" text-anchor="end">stop-line d · speed limit (HOLD·비상 판단)</text>

  <!-- MORAI -->
  <rect x="620" y="880" width="300" height="80" rx="10" fill="#f1f0ec" stroke="#52514e" stroke-width="1.8"/>
  <text x="770" y="914" font-size="18" font-weight="bold" fill="#0b0b0b" text-anchor="middle">MORAI</text>
  <text x="770" y="940" font-size="13" fill="#52514e" text-anchor="middle">차량 구동 · ctrl UDP :9093</text>
  <line x1="770" y1="828" x2="770" y2="872" stroke="#52514e" stroke-width="2" marker-end="url(#ca)"/>
  <text x="782" y="856" font-size="12" fill="#52514e" font-family="Consolas, monospace">/ctrl_cmd · 50Hz</text>

  <!-- 설계 포인트 -->
  <rect x="1060" y="840" width="580" height="130" rx="10" fill="#ffffff" stroke="#d8d7d2" stroke-width="1.5"/>
  <text x="1082" y="872" font-size="15.5" font-weight="bold" fill="#0b0b0b">구조 특징</text>
  <text x="1082" y="900" font-size="13.5" fill="#52514e">① 모든 노드가 같은 측위 토픽을 사용 → 좌표계·시점 불일치 방지</text>
  <text x="1082" y="925" font-size="13.5" fill="#52514e">② MPC와 Fallback을 동시에 실행 → 전환 시에도 제어 명령이 끊기지 않음</text>
  <text x="1082" y="950" font-size="13.5" fill="#52514e">③ 최종 명령은 Control Decision에서만 출력 → 명령 충돌 방지</text>
</svg>
